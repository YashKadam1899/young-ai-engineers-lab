<!--
  Source for public/og-image.png (1200x630 Open Graph / Twitter share card).
  Interim asset: system Helvetica, not the brand fonts (Bricolage Grotesque /
  Plus Jakarta Sans) — a designer should replace it. Regenerate the PNG with
  the sharp copy Astro already installs:

    node -e "require(\"sharp\")(\"src/assets/og-image.svg\").png().flatten({background:\"#faf6ec\"}).toFile(\"public/og-image.png\")"
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#faf6ec"/>
  <circle cx="1150" cy="30" r="230" fill="#9ecbb6" opacity="0.55"/>
  <circle cx="40" cy="660" r="200" fill="#fcd98c" opacity="0.5"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="80" y="118" font-size="34" font-weight="bold" fill="#14213d" letter-spacing="0.5">Young <tspan fill="#2c6150">AI</tspan> Engineers Lab</text>
    <text x="80" y="268" font-size="58" font-weight="bold" fill="#14213d">Turning India&#8217;s future workforce</text>
    <text x="80" y="340" font-size="58" font-weight="bold" fill="#14213d">from AI consumers into AI developers</text>
    <text x="80" y="430" font-size="26" font-weight="bold" fill="#2c6150" letter-spacing="1.2">LIVE ONLINE &#183; 12 SESSIONS OVER 6 WEEKS &#183; AGES 10&#8211;15 &#183; ENGLISH</text>
  </g>
  <rect x="0" y="606" width="1200" height="24" fill="#f5a524"/>
</svg>
