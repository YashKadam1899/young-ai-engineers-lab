name: Deploy to GitHub Pages

# Publishes the live site (branch `main`) at the root of the custom domain.
#
# The build and the SEO check (scripts/seo-check.mjs) are hard gates: if either
# fails, nothing deploys. The github-pages environment allows deploys from
# `main` only.
#
# Plain node steps rather than withastro/action, so each step and its failure
# is visible in the run log.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build site
        run: |
          npm ci
          npx astro build

      - name: SEO check
        run: node scripts/seo-check.mjs dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
