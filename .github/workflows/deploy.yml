name: Deploy to GitHub Pages

# Publishes the live site (branch `main`, website 2.0) at the root and the
# frozen 1.0 (branch `website-1.0`) at /v1/, as ONE Pages artifact.
#
# The live site is the gate: if it fails to build or fails the SEO check
# (scripts/seo-check.mjs), nothing deploys. Everything about /v1/ is marked
# `continue-on-error: true`, so a missing or broken archive deploys the live
# site alone, with a ::warning:: and a job-summary note.
#
# The probe for the 1.0 branch and the final "archive skipped" warning are the
# only /v1/ steps without continue-on-error, so neither may exit non-zero: "ref not found" and a failed
# query (git ls-remote fails twice, e.g. network or auth) both deploy the live
# site alone with a ::warning::, worded so the two cases can be told apart.
# A Pages deploy replaces the whole site, so either way /v1/ is gone until the
# next run that finds the branch; re-run the workflow after a failed query.
#
# The archive is checked with main's seo-check.mjs, not the copy on
# website-1.0, so the gate that proves /v1/ is noindex is always main's.
#
# /v1/ is built with PUBLIC_PREVIEW=1: noindex on every page, canonicals
# pointing at the matching root page. Its own robots.txt and sitemaps are
# dropped so only the live site's are published.
#
# Plain node steps rather than withastro/action: that action builds ONE project
# and uploads the Pages artifact itself, so it can't merge two builds first.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  V1_BRANCH: website-1.0
  V1_BASE: /young-ai-engineers-lab/v1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ---- Live site: main, whichever ref triggered a manual run ----
      - name: Check out main (live)
        uses: actions/checkout@v4
        with:
          ref: main
          path: live

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: live/package-lock.json

      - name: Build live site
        working-directory: live
        run: |
          npm ci
          npx astro build

      - name: SEO check (live)
        working-directory: live
        run: node scripts/seo-check.mjs dist

      # ---- /v1/ archive: best effort; never blocks the live site ----
      - name: Look for ${{ env.V1_BRANCH }}
        id: probe
        working-directory: live
        run: |
          # --exit-code: 0 = branch found, 2 = no such ref, anything else = the
          # query itself failed (network, auth). Only 2 means "missing".
          probe() {
            rc=0
            git ls-remote --exit-code --heads origin "$V1_BRANCH" >/dev/null || rc=$?
          }
          probe
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "git ls-remote failed with exit $rc; retrying once in 15s." >&2
            sleep 15
            probe
          fi
          case "$rc" in
            0)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              msg="No '$V1_BRANCH' branch on the remote; deploying the live site alone, so /v1/ is not served by this deploy."
              echo "::warning title=/v1/ not published::$msg"
              echo "**Warning:** $msg" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              msg="Could not check for '$V1_BRANCH' (git ls-remote exit $rc, twice); deploying the live site alone, so /v1/ is not served by this deploy. Re-run the workflow to restore it."
              echo "::warning title=/v1/ not published (probe failed)::$msg"
              echo "**Warning:** $msg" >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

      - name: Check out ${{ env.V1_BRANCH }} (archive)
        id: checkout_v1
        if: steps.probe.outputs.exists == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ env.V1_BRANCH }}
          path: v1

      - name: Build archive (noindex, under /v1/)
        id: build_v1
        if: steps.checkout_v1.outcome == 'success'
        continue-on-error: true
        working-directory: v1
        env:
          PUBLIC_PREVIEW: "1"
        run: |
          npm ci
          npx astro build --base "$V1_BASE"
          # main's checker, not the archive branch's own copy.
          node ../live/scripts/seo-check.mjs dist --archive
          rm -f dist/robots.txt dist/sitemap-index.xml dist/sitemap-*.xml

      - name: Merge archive into the live dist/v1
        id: merge_v1
        if: steps.build_v1.outcome == 'success'
        continue-on-error: true
        run: |
          if [ -e live/dist/v1 ]; then
            echo "The live site already has a dist/v1 path; refusing to overwrite it." >&2
            exit 1
          fi
          cp -R v1/dist live/dist/v1
          echo "Published 1.0 from $(git -C v1 rev-parse --short HEAD) at /v1/." >> "$GITHUB_STEP_SUMMARY"

      - name: Warn if the archive was skipped
        if: >-
          steps.probe.outputs.exists == 'true' &&
          steps.merge_v1.outcome != 'success'
        run: |
          msg="1.0 ($V1_BRANCH) failed to check out, build, pass the archive SEO check or merge; deploying the live site alone, so /v1/ is not served by this deploy."
          echo "::warning title=/v1/ not published::$msg"
          echo "**Warning:** $msg" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: live/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
